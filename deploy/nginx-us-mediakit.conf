# Rate-Limiting (Burst/Concurrency) auf nginx-Ebene — ergänzt das Anwendungs-Limit in
# Credits/Minute pro Plan-Tier (siehe us_mediakit.billing.rate_limit.CreditsRateLimiter)
# und die tarifunabhängige Zusatzschwelle für gleichzeitige Video-/PDF-Jobs
# (ConcurrencyLimiter, direkt im Endpunkt verdrahtet). limit_req_zone gehört in den
# http{}-Kontext von nginx.conf, nicht hierhin — siehe Hinweis unten.
#
# In nginx.conf (http-Block):
#   limit_req_zone $binary_remote_addr zone=usmediakit:10m rate=10r/s;

server {
    listen 443 ssl;
    server_name us-mediakit.internal.urbanstudio.de;
    ssl_certificate     /etc/letsencrypt/live/us-mediakit.internal.urbanstudio.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/us-mediakit.internal.urbanstudio.de/privkey.pem;

    # Rein interner Dienst — eigenes Netz/VPN-Bereich anpassen.
    allow 10.0.0.0/8;
    deny all;

    limit_req zone=usmediakit burst=20 nodelay;
    client_max_body_size 100m;  # große Originalbilder/Videos, siehe core.security-Limits

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
