name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl ffmpeg poppler-utils
      - name: Install package
        run: pip install -e ".[server,dev]"
      - name: Install cuttlefish (mock LLM server for vision_chat tests)
        # Bewusst getrennt von "pip install -e .[dev]": "cuttlefish" ist auf PyPI durch
        # ein fremdes, unverwandtes Paket belegt, siehe pyproject.toml-Kommentar. Nur auf
        # 3.12 installierbar (cuttlefish selbst verlangt Python >= 3.12) -- auf 3.10/3.11
        # übersprungen, test_caption.py überspringt die betroffenen Tests dann selbst
        # (skipif auf `shutil.which("cuttlefish")`).
        if: matrix.python-version == '3.12'
        run: pip install "cuttlefish @ git+https://github.com/urbanstudioGmbH/cuttlefish.git"
      - name: Run tests
        run: pytest --cov=us_mediakit
      - name: Lint
        run: ruff check src tests
