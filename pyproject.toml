[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "us-mediakit"
version = "1.1.0"
description = "Image metadata, C2PA content credentials and AI-assisted image processing — library, CLI and network service"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Marian Feiler", email = "mf@urbanstudio.de" },
    { name = "urbanstudio GmbH", email = "post@urbanstudio.de" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "Pillow>=10.0",
    "pillow-heif>=0.15",
    "c2pa-python>=0.5",
    # Für das unsichtbare Wasserzeichen (DWT-DCT-SVD, siehe watermark/_dwt_dct_svd.py) --
    # bewusst Kern-Abhängigkeiten statt eines optionalen Extras: der Algorithmus selbst
    # ist reine Bildverarbeitung ohne ML-Modell, im Gegensatz zur früher genutzten
    # invisible-watermark-Bibliothek, die dafür unbedingt PyTorch mitgezogen hätte.
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "PyWavelets>=1.4",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "alembic>=1.13",
    "PyYAML>=6.0",
]
mysql = ["pymysql>=1.1"]
postgres = ["psycopg>=3.1"]
fast = ["pyvips>=2.2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    # cuttlefish (OpenAI-kompatibler Mock-Server für vision_chat-Tests) bewusst NICHT
    # hier als PyPI-Abhängigkeit gelistet: "cuttlefish" ist auf PyPI durch ein fremdes,
    # unverwandtes Paket belegt (ein Python-2-only Grep-Tool von 2013). Ein normaler
    # `pip install`/Release-Build würde damit das falsche Paket ziehen. Stattdessen
    # manuell installieren: pip install "cuttlefish @ git+https://github.com/urbanstudioGmbH/cuttlefish.git"
    # (siehe CONTRIBUTING.md und .github/workflows/test.yml).
]

[project.urls]
Homepage = "https://github.com/urbanstudioGmbH/us-mediakit"
Issues = "https://github.com/urbanstudioGmbH/us-mediakit/issues"

[project.scripts]
us-mediakit = "us_mediakit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/us_mediakit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/us_mediakit/db/migrations"]

[tool.ruff.lint.flake8-bugbear]
# FastAPIs Dependency-Injection-Idiom verlangt `Depends(...)`/`Query(...)` als
# Parameter-Default — kein tatsächlich veränderlicher Default-Wert (B008-Fehlalarm).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.mypy]
# Eigentlich 3.10 (Mindestversion des Pakets, siehe pyproject [project].requires-python)
# — aber numpys eigene .pyi-Stub-Datei nutzt PEP-695-Syntax (3.12+) und lässt mypy schon
# beim reinen Parsen abstürzen, unabhängig von jedem [[tool.mypy.overrides]]-Eintrag
# (ausprobiert: follow_imports=skip + ignore_errors verhindert den Absturz nicht). Da
# mypy nicht Teil der CI ist (siehe .github/workflows/test.yml — dort läuft pytest über
# 3.10/3.11/3.12, die eigentliche Kompatibilitätsprüfung), hier pragmatisch auf die
# tatsächliche Dev-Umgebung gesetzt statt auf die Paket-Mindestversion.
python_version = "3.12"
ignore_missing_imports = true
exclude = ["src/us_mediakit/db/migrations"]
