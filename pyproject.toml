[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "us-mediakit"
version = "0.1.0.dev0"
description = "Image metadata, C2PA content credentials and AI-assisted image processing — library, CLI and network service"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "urbanstudio GmbH", email = "post@urbanstudio.de" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "Pillow>=10.0",
    "pillow-heif>=0.15",
    "c2pa-python>=0.5",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
]
mysql = ["pymysql>=1.1"]
postgres = ["psycopg>=3.1"]
fast = ["pyvips>=2.2"]
watermark = ["invisible-watermark>=0.2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.urls]
Homepage = "https://github.com/urbanstudioGmbH/us-mediakit"
Issues = "https://github.com/urbanstudioGmbH/us-mediakit/issues"

[project.scripts]
us-mediakit = "us_mediakit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/us_mediakit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
